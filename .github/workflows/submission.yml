# Közösségi beküldés: a „template-submission” címkés issue-ból ellenőrzött sablon és pull request lesz.
# A beküldött tartalom megbízhatatlan: csak környezeti változón keresztül kerül a szkripthez, shellbe soha.
name: Template submission
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  submit:
    if: contains(github.event.issue.labels.*.name, 'template-submission') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mzzg-bazsi/narancs-signage
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: sub
        run: node --disable-warning=ExperimentalWarning tools/submission.mjs app
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ github.token }}
      - name: Pull request
        if: steps.sub.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          TID: ${{ steps.sub.outputs.id }}
          TNAME: ${{ steps.sub.outputs.name }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          branch="submission/issue-$NUM"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add templates
          git commit -m "Template: $TNAME (#$NUM)"
          git push -f origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --head "$branch" --title "Template: $TNAME" --body "Submitted by @$AUTHOR in #$NUM. The template passed validation. Merge to publish it in the gallery."
          fi
          pr="$(gh pr view "$branch" --json url -q .url)"
          printf '✅ **Thank you!** The template passed the checks and is waiting for review: %s\n\n✅ **Köszönjük!** A sablon átment az ellenőrzésen, és jóváhagyásra vár: %s\n\nFolder / mappa: `templates/%s`' "$pr" "$pr" "$TID" > comment.md
          gh issue comment "$NUM" --body-file comment.md
      - name: Report problem
        if: steps.sub.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          ERR: ${{ steps.sub.outputs.error }}
        run: |
          printf '❌ The template could not be accepted / A sablon nem fogadható el:\n\n> %s\n\nPlease fix it and edit this issue – it will be checked again. / Javítsd, és szerkeszd az issue-t – újra ellenőrizzük.' "$ERR" > comment.md
          gh issue comment "$NUM" --body-file comment.md
